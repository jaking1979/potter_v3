name: Offline C1 shape adapter probe
on:
  push:
    branches: [dolores/c6-c1-shape-0634]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact head
        env:
          EXPECTED: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.23.0
      - name: Focused adapter tests
        run: python -m unittest discover -s tests -p test_c1_shape_adapter.py -v
      - name: C6 tree tests
        run: python -m unittest discover -s tests -v
