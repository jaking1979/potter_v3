name: C6 real integration probe
on:
  push:
    branches: [dolores/c6-postshape-trace-20261113]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.23.0
      - name: Run focused real-component probe
        run: python -m unittest discover -s tests -p test_postshape_trace.py -v
      - name: Run full Python suite
        run: python -m unittest discover -s tests -v
