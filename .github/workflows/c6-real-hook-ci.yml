name: C1 E2 C6 offline hook probe
on:
  push:
    branches: [dolores/c6-real-hook-probe-0731]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.23.0
      - name: Offline actual-component hook tests
        run: python -m unittest discover -s tests -p test_real_c1_c6_hook.py -v
      - name: Full Python tests
        run: python -m unittest discover -s tests -v
