name: Exact candidate full-history tests
on:
  push:
    branches: [dolores/carbon-exact-head-ci-20261113]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out candidate and history
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e 225e7df^{commit}
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Run repository Python tests
        run: python -m unittest discover -s tests -v
