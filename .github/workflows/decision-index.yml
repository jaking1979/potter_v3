name: decision-index
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Decision wording drift gate
        run: python3 tools/decision_index.py check
      - name: Coverage of ratified decisions (fails until T1-T39 are all indexed)
        run: python3 tools/decision_index.py coverage
