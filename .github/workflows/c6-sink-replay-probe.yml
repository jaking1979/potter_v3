name: C6 replay bridge offline probe
on:
  push:
    branches: [dolores/c6-sink-replay-0125-20261114]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.23.0
      - name: Real offline sink replay test
        run: python -m unittest discover -s tests -p test_policy_sink_bridge.py -v
      - name: Full Python tests
        run: python -m unittest discover -s tests -v
