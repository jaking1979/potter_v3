name: unit-tests
on:
  pull_request:
  push:
    branches: [main, dolores/ci-exact-candidate-20261113]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and history
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test-only dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Python tests, fail on skips
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/potter-tests.log
          if grep -Eq '\.\.\. skipped |^OK \(skipped=' /tmp/potter-tests.log; then
            echo "Required test was skipped" >&2
            exit 1
          fi
      - name: A4a tests when present
        shell: bash
        run: |
          if test -d evaluation/a4a; then
            set -o pipefail
            python -m unittest discover -s evaluation/a4a -p 'test_*.py' -v 2>&1 | tee /tmp/potter-a4a.log
            if grep -Eq '\.\.\. skipped |^OK \(skipped=' /tmp/potter-a4a.log; then
              echo "Required A4a test was skipped" >&2
              exit 1
            fi
          else
            echo "A4a directory absent: A4a coverage not established on this candidate."
          fi
