name: unit-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test-only dependency (schema validator, pinned)
        run: python3 -m pip install jsonschema==4.23.0
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
