name: containment-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Containment unit tests (stdlib only, no network)
        run: python3 -m unittest -v tests.test_containment_guard tests.test_containment_watchdog
