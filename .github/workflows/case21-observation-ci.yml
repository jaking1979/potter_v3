name: A4a exact-head offline coverage probe
on:
  push:
    branches: [dolores/ci-required-node-1434]
permissions:
  contents: read
jobs:
  a4a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate and required directory
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -d evaluation/a4a
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: A4a Python test discovery
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s evaluation/a4a -p 'test_*.py' -v 2>&1 | tee /tmp/potter-a4a.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' /tmp/potter-a4a.log || { echo 'No A4a tests discovered' >&2; exit 1; }
          if grep -Eq '\.\.\. skipped |^OK \(skipped=' /tmp/potter-a4a.log; then
            echo "Required A4a test was skipped" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Node coverage guard
        run: python -m unittest discover -s ci -p 'test_check_tap.py' -v
      - name: A4a Node tests
        shell: bash
        run: |
          shopt -s nullglob
          files=(evaluation/a4a/*.test.mjs)
          expected=(evaluation/a4a/bound_comparison.test.mjs evaluation/a4a/grade_vectors.test.mjs evaluation/a4a/pair_identity.test.mjs evaluation/a4a/reproducibility.test.mjs)
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          node --version
          set -o pipefail
          node --test --test-reporter=tap "${files[@]}" 2>&1 | tee /tmp/potter-node.tap
          python ci/check_tap.py /tmp/potter-node.tap 20
