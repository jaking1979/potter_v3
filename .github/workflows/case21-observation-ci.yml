name: A4a exact-head offline coverage probe
on:
  push:
    branches: [dolores/ci-strict-summary-1733]
permissions:
  contents: read
jobs:
  a4a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate and required directory
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -d evaluation/a4a
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: A4a Python test discovery
        shell: bash
        run: |
          python -m unittest discover -s ci -p 'test_strict_unittest.py' -v
          python -m unittest discover -s ci -p 'test_supervise_unittest.py' -v
          python ci/supervise_unittest.py evaluation/a4a
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Node coverage guard
        run: python -m unittest discover -s ci -p 'test_check_tap.py' -v
      - name: A4a Node tests
        shell: bash
        run: |
          shopt -s nullglob
          files=(evaluation/a4a/*.test.mjs)
          test "${#files[@]}" -gt 0
          set -o pipefail
          node --test --test-reporter=tap "${files[@]}" 2>&1 | tee /tmp/potter-node.tap
          python ci/check_tap.py /tmp/potter-node.tap
